<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asesmen Refleksi Diri</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e3a5f);
    color:#172033;
    min-height:100vh;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

/* =========================
   HERO / HALAMAN AWAL
========================= */

.hero{
    min-height:480px;
    border-radius:25px;
    overflow:hidden;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;

    background-image:
    linear-gradient(
        rgba(5,15,35,.68),
        rgba(5,15,35,.82)
    ),
    url("https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=1400&q=85");

    background-size:cover;
    background-position:center;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.hero-content{
    padding:35px 20px;
}

.logo{
    font-size:60px;
    margin-bottom:10px;
}

.hero h1{
    font-size:36px;
    margin:0 0 15px;
}

.hero p{
    max-width:650px;
    margin:auto;
    line-height:1.7;
    font-size:16px;
}

.badges{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:25px;
}

.badge{
    padding:10px 15px;
    border-radius:30px;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.3);
    backdrop-filter:blur(8px);
}

/* =========================
   CARD
========================= */

.card{
    background:white;
    border-radius:22px;
    padding:25px;
    margin:18px 0;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

h2,h3{
    margin-top:0;
}

/* =========================
   INPUT
========================= */

input{
    width:100%;
    padding:15px;
    border:2px solid #e2e8f0;
    border-radius:12px;
    font-size:16px;
    margin:8px 0 15px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

/* =========================
   BUTTON
========================= */

button{
    border:0;
    border-radius:12px;
    padding:14px 20px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:#2563eb;
    color:white;
    transition:.2s;
    -webkit-tap-highlight-color:transparent;
}

button:hover{
    opacity:.9;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.start-button{
    width:100%;
    padding:17px;
    font-size:18px;
    margin-top:10px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    box-shadow:0 8px 20px rgba(37,99,235,.3);
}

.secondary{
    background:#64748b;
}

/* =========================
   NOTE
========================= */

.note{
    background:#fff7ed;
    border-left:5px solid #f59e0b;
    padding:15px;
    border-radius:8px;
    line-height:1.6;
}

/* =========================
   QUIZ
========================= */

.question-number{
    font-size:14px;
    color:#64748b;
    font-weight:bold;
}

.progress{
    height:10px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
    margin:15px 0 25px;
}

.progress div{
    height:100%;
    width:0;
    background:#2563eb;
    transition:.3s;
}

.question{
    font-size:21px;
    line-height:1.5;
    margin:15px 0 20px;
}

.option{
    display:block;
    width:100%;
    text-align:left
